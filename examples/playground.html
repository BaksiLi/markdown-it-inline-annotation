<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inline Annotation Playground</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --panel: #ffffff;
        --ink: #202326;
        --muted: #667076;
        --line: #d7dde1;
        --field: #fbfcfd;
        --accent: #17736b;
        --accent-ink: #ffffff;
        --code: #172026;
        --mark: #f1b24a;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 36px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 4vw, 3.2rem);
        line-height: 1;
        letter-spacing: 0;
      }

      .meta {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      select,
      textarea,
      output {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }

      select {
        min-width: min(360px, 100%);
        height: 38px;
        padding: 0 36px 0 10px;
      }

      .toggle {
        display: inline-flex;
        grid-template-columns: none;
        align-items: center;
        gap: 8px;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        text-transform: none;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .toggle input { margin: 0; accent-color: var(--accent); }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px;
        margin-top: 16px;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }

      .panel h2 {
        margin: 0;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--accent);
        font-size: 0.78rem;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      textarea {
        display: block;
        width: 100%;
        min-height: 460px;
        resize: vertical;
        padding: 14px;
        border: 0;
        border-radius: 0 0 8px 8px;
        font: 1rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      .preview,
      output {
        display: block;
        min-height: 222px;
        padding: 16px;
        border: 0;
        border-radius: 0 0 8px 8px;
      }

      .preview {
        overflow-wrap: anywhere;
        font-size: 1.45rem;
        background: var(--panel);
      }

      output {
        overflow: auto;
        white-space: pre-wrap;
        color: var(--code);
        font: 0.92rem/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--field);
      }

      mark {
        padding: 0 0.12em;
        background: color-mix(in srgb, var(--mark) 40%, transparent);
      }

      /* Canonical Inline Annotation stylesheet. */
      /*
       * Inline Annotation — canonical reference stylesheet
       *
       * Class contract shared by every Inline Annotation implementation
       * (markdown-it, Logseq, Obsidian, future remark/unified).
       *
       * The default class prefix is `ia-`. If you pass a custom `classPrefix`,
       * adapt these selectors accordingly.
       *
       * This stylesheet makes class-mode output (inlineStyles: false) render
       * identically to the default inline-style output. The over/under
       * positions are declared explicitly on BOTH slots because `ruby-position`
       * is a CSS inherited property: a nested over-ruby inside an under-ruby
       * would otherwise inherit `under` and drop both annotations below the base.
       */

      ruby.ia-ruby {
        display: ruby;
      }

      ruby.ia-ruby rt {
        font-size: 0.6em;
        line-height: 1;
      }

      /* Explicit positioning — required to break ruby-position inheritance. */
      ruby.ia-ruby.ia-ruby-over {
        ruby-position: over;
      }

      ruby.ia-ruby.ia-ruby-under {
        ruby-position: under;
      }

      /* Bouten (emphasis dots) above. */
      span.ia-bouten.ia-bouten-over {
        text-emphasis: filled dot;
        -webkit-text-emphasis: filled dot;
        text-emphasis-position: over right;
        -webkit-text-emphasis-position: over right;
      }

      /* Bouten below (dotted underline). */
      span.ia-bouten.ia-bouten-under {
        text-decoration: underline dotted;
        text-underline-offset: 0.15em;
      }

      /* Bouten above + below. */
      span.ia-bouten.ia-bouten-over.ia-bouten-under {
        text-emphasis: filled dot;
        -webkit-text-emphasis: filled dot;
        text-emphasis-position: over right;
        -webkit-text-emphasis-position: over right;
        text-decoration: underline dotted;
        text-underline-offset: 0.15em;
      }

      /* Line marks: .- solid, .~ wavy, .= double.
       * The slot picks the side — over renders as an overline, under as an underline. */
      span.ia-underline {
        text-decoration-line: underline;
        text-underline-offset: 0.15em;
      }

      span.ia-overline {
        text-decoration-line: overline;
      }

      .ia-underline-wavy,
      .ia-overline-wavy {
        text-decoration-style: wavy;
      }

      .ia-underline-double,
      .ia-overline-double {
        text-decoration-style: double;
      }

      /* Both sides at once: a single text-decoration-line must carry both keywords,
       * otherwise the two declarations collide and one line is dropped. The combined
       * selectors below outrank the single-side rules above. */
      span.ia-overline.ia-underline {
        text-decoration-line: overline underline;
      }

      span.ia-bouten-under.ia-overline {
        text-decoration: none;
        text-decoration-line: overline underline;
        text-decoration-style: dotted;
        text-underline-offset: 0.15em;
      }

      /* Ruby annotation combined with a decoration modifier. */
      ruby.ia-ruby-mixed.ia-bouten-over {
        text-emphasis: filled dot;
        -webkit-text-emphasis: filled dot;
        text-emphasis-position: over right;
        -webkit-text-emphasis-position: over right;
      }

      ruby.ia-ruby-mixed.ia-bouten-under {
        text-decoration: underline dotted;
        text-underline-offset: 0.15em;
      }

      ruby.ia-ruby-mixed.ia-underline {
        text-decoration-line: underline;
        text-underline-offset: 0.15em;
      }

      ruby.ia-ruby-mixed.ia-overline {
        text-decoration-line: overline;
      }


      @media (max-width: 820px) {
        main { width: min(100% - 24px, 1180px); }
        header { align-items: stretch; flex-direction: column; }
        .toolbar { justify-content: stretch; }
        select { width: 100%; }
        .workspace { grid-template-columns: 1fr; }
        textarea { min-height: 260px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Inline Annotation</h1>
          <p class="meta">Core renderer playground. Do not edit by hand. Run `npm run build:examples`.</p>
        </div>
        <div class="toolbar">
          <label>
            Fixture
            <select id="example"></select>
          </label>
          <label class="toggle">
            <input id="classMode" type="checkbox" />
            Class CSS
          </label>
        </div>
      </header>

      <section class="workspace">
        <div class="panel">
          <h2>Source</h2>
          <textarea id="source" spellcheck="false"></textarea>
        </div>
        <div class="stack">
          <div class="panel">
            <h2>Preview</h2>
            <div id="preview" class="preview"></div>
          </div>
          <div class="panel">
            <h2>HTML</h2>
            <output id="html"></output>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { renderInlineAnnotationsToHtml } from "../dist/core.mjs";

      const examples = [
        {
                "id": "ruby-basic-over",
                "category": "ruby",
                "name": "basic over ruby",
                "input": "[漢字]^^(かんじ)"
        },
        {
                "id": "ruby-basic-under",
                "category": "ruby",
                "name": "basic under ruby",
                "input": "[base]^_(ann)"
        },
        {
                "id": "ruby-abbreviated",
                "category": "ruby",
                "name": "abbreviated base",
                "input": "東京^^(とうきょう)"
        },
        {
                "id": "ruby-multiple",
                "category": "ruby",
                "name": "multiple annotations in one paragraph",
                "input": "[東]^^(ひがし)[京]^^(きょう)"
        },
        {
                "id": "ruby-pipe-two-slot",
                "category": "slots",
                "name": "pipe two-slot annotation",
                "input": "[北京]^^(ペキン|Beijing)"
        },
        {
                "id": "ruby-mixed-chain",
                "category": "slots",
                "name": "mixed chained annotation",
                "input": "[base]^^(over)^_(under)"
        },
        {
                "id": "ruby-reverse-chain",
                "category": "slots",
                "name": "reverse chained annotation",
                "input": "[base]^_(under)^^(over)"
        },
        {
                "id": "ruby-same-op-chain-not-merged",
                "category": "slots",
                "name": "same operator chain is not merged",
                "input": "[base]^^(a)^^(b)"
        },
        {
                "id": "ruby-pipe-saturated-passes-through",
                "category": "slots",
                "name": "pipe-saturated annotation leaves later operator as text",
                "input": "[base]^^(over|under)^_(..)"
        },
        {
                "id": "ruby-pipe-extra-level-passes-through",
                "category": "slots",
                "name": "extra pipe level leaves overflow text visible",
                "input": "[a]^^(x|y|z)"
        },
        {
                "id": "align-per-character",
                "category": "alignment",
                "name": "per-character alignment",
                "input": "[春夏秋冬]^^(はる なつ あき ふゆ)"
        },
        {
                "id": "align-auto-hide",
                "category": "alignment",
                "name": "auto-hide matching character",
                "input": "[振り仮名]^^(ふ り が な)"
        },
        {
                "id": "align-two-level-per-character",
                "category": "alignment",
                "name": "two-level per-character alignment",
                "input": "[李太白]^^(Lǐ Tài Bái|ㄌㄧˇ ㄊㄞˋ ㄅㄞˊ)"
        },
        {
                "id": "nested-bracket-span",
                "category": "nesting",
                "name": "nested bracket span",
                "input": "[[護]^^(まも)れ]^_(プロテゴ)"
        },
        {
                "id": "nested-title-style",
                "category": "nesting",
                "name": "nested title-style annotations",
                "input": "[初音ミク^^(偉大なる|世界一姫様)]^_(Vocaloid)"
        },
        {
                "id": "decoration-bouten-over",
                "category": "decoration",
                "name": "bouten over",
                "input": "[漢字]^^(..)"
        },
        {
                "id": "decoration-bouten-both",
                "category": "decoration",
                "name": "bouten both slots",
                "input": "[漢字]^^(..)^_(..)"
        },
        {
                "id": "decoration-underline-wavy",
                "category": "decoration",
                "name": "underline wavy",
                "input": "[base]^_(.~)"
        },
        {
                "id": "decoration-overline-over-slot",
                "category": "decoration",
                "name": "over-slot line mark is an overline",
                "input": "[base]^^(.-)"
        },
        {
                "id": "decoration-overline-wavy",
                "category": "decoration",
                "name": "wavy overline over slot",
                "input": "[base]^^(.~)"
        },
        {
                "id": "decoration-overline-and-underline",
                "category": "decoration",
                "name": "overline above plus wavy underline below",
                "input": "[base]^^(.-)^_(.~)"
        },
        {
                "id": "decoration-mark-escaped-is-text",
                "category": "decoration",
                "name": "escaped over-slot mark stays ruby text",
                "input": "[base]^^(\\.-)"
        },
        {
                "id": "decoration-ruby-plus-underline",
                "category": "decoration",
                "name": "ruby plus underline",
                "input": "[重要語句]^^(じゅうようごく|.-)"
        },
        {
                "id": "escape-pipe-literal",
                "category": "escaping",
                "name": "escaped pipe stays literal",
                "input": "[A|B]^^(a\\|b)"
        },
        {
                "id": "escape-right-paren",
                "category": "escaping",
                "name": "escaped right paren stays literal",
                "input": "[base]^^(a\\)b)"
        },
        {
                "id": "escape-close-bracket-base",
                "category": "escaping",
                "name": "escaped close bracket in base stays literal",
                "input": "[A\\]B]^^(ann)"
        },
        {
                "id": "escape-open-bracket-base",
                "category": "escaping",
                "name": "escaped open bracket in base stays literal",
                "input": "[A\\[B]^^(ann)"
        },
        {
                "id": "safety-html-escaped",
                "category": "safety",
                "name": "base and annotation HTML are escaped",
                "input": "[\u003cimg src=x\u003e]^^(\u003cscript\u003ex\u003c/script\u003e)"
        },
        {
                "id": "safety-ia-class-text-escaped",
                "category": "safety",
                "name": "ia class text without generated tag is escaped",
                "input": "[ia-ruby \u003cimg src=x\u003e]^^(ann)"
        },
        {
                "id": "safety-generated-looking-html-escaped",
                "category": "safety",
                "name": "user-authored generated-looking HTML is escaped",
                "input": "[\u003cspan class=\"ia-ruby\"\u003e\u003cimg src=x\u003e\u003c/span\u003e]^^(ann)"
        },
        {
                "id": "reject-newline-annotation",
                "category": "rejection",
                "name": "newline in annotation rejects",
                "input": "[base]^^(ann\ntext)"
        }
];
      const source = document.getElementById("source");
      const preview = document.getElementById("preview");
      const html = document.getElementById("html");
      const select = document.getElementById("example");
      const classMode = document.getElementById("classMode");

      function render() {
        const rendered = renderInlineAnnotationsToHtml(source.value, {
          inlineStyles: !classMode.checked,
        });
        const withBreaks = rendered.replace(/\n/g, "<br>");
        preview.innerHTML = withBreaks;
        html.textContent = withBreaks;
      }

      const custom = document.createElement("option");
      custom.value = "";
      custom.textContent = "Custom";
      select.append(custom);

      for (const item of examples) {
        const option = document.createElement("option");
        option.value = item.id;
        option.textContent = item.category + " / " + item.name;
        select.append(option);
      }

      source.value = "[漢字]^^(かんじ) and cat^_(/kæt/)\n[李太白]^^(Lǐ Tài Bái|ㄌㄧˇ ㄊㄞˋ ㄅㄞˊ)\n[重要語句]^^(じゅうようごく|.-)";
      render();

      source.addEventListener("input", () => {
        select.value = "";
        render();
      });

      select.addEventListener("change", () => {
        const item = examples.find((candidate) => candidate.id === select.value);
        if (!item) return;
        source.value = item.input;
        render();
      });

      classMode.addEventListener("change", render);
    </script>
  </body>
</html>
