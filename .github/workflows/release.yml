name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_TYPE, "tag");
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          NODE
      - run: npm ci
      - run: npm run check:release
      - name: Pack and publish with npm trusted publishing
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync, spawnSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          import { join } from "node:path";
          const [archive] = JSON.parse(execFileSync("npm", [
            "pack", "--ignore-scripts", "--json",
            "--pack-destination", process.env.RUNNER_TEMP,
          ], { encoding: "utf8" }));
          const filename = join(process.env.RUNNER_TEMP, archive.filename);
          const previous = spawnSync("npm", [
            "view", `${archive.name}@${archive.version}`, "dist.integrity", "--json",
          ], { encoding: "utf8" });
          if (previous.status === 0) {
            assert.equal(JSON.parse(previous.stdout), archive.integrity,
              "The published version must match this exact archive");
          } else {
            const error = JSON.parse(previous.stdout);
            assert.equal(error.error?.code, "E404", previous.stderr);
            execFileSync("npm", [
              "publish", filename, "--access", "public", "--provenance",
            ], { stdio: "inherit" });
          }
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_ARCHIVE=${filename}\n`);
          NODE
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$RELEASE_ARCHIVE" --clobber
